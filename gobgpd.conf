# /etc/gobgpd.conf  -  Flowspec Solutions  -  GoBGP como injetor de BGP FlowSpec
#
# Este GoBGP so ANUNCIA regras FlowSpec (geradas pelo c2flowspec). Nao precisa
# receber rota de ninguem, por isso a policy de import nega tudo (defesa contra
# um BRAS mal configurado despejar tabela cheia aqui).
#
# AJUSTE: router-id = IP deste host. Se o host tiver mais de um IP, fixe
#         local-address em cada neighbor (bloco transport, comentado).

[global.config]
  as = 268268
  router-id = "172.150.150.2"

# ------------------------------------------------------------------------------
# Politica: nao importar nada dos peers (so exportamos FlowSpec)
# ------------------------------------------------------------------------------
[[policy-definitions]]
  name = "deny-all"
  [[policy-definitions.statements]]
    name = "deny"
    [policy-definitions.statements.actions]
      route-disposition = "reject-route"

# ============================================================================
#  AS 53065  -  bras-axs-01 / 04 / 06  (sessao direta, TTL 1)
# ============================================================================
[[neighbors]]
  [neighbors.config]
    neighbor-address = "187.86.49.252"
    peer-as = 53065
    description = "bras-axs-01"
  [neighbors.apply-policy.config]
    import-policy-list = ["deny-all"]
    default-import-policy = "reject-route"
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv4-flowspec"
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv6-flowspec"

[[neighbors]]
